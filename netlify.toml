[build]
  command = "npm run build"
  publish = "public"

# The API and background worker are hosted separately on Render.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; font-src 'self' blob:; img-src 'self' blob:; connect-src 'self' https://vkpvgpbdnlnngwzttciy.supabase.co https://ai-dev-chatbot.onrender.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
